# Deploy docs/ to GitHub Pages when the site or its slower data changes.
# The tracker's hourly availability.json / README commits are excluded so Pages does not rebuild every hour;
# the page reads that file live from raw.githubusercontent.com instead.
name: pages
on:
  push:
    branches: [main]
    paths: ["docs/**", "!docs/data/availability.json"]
  workflow_dispatch:
permissions: {contents: read, pages: write, id-token: write}
concurrency: {group: pages, cancel-in-progress: true}
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: {name: github-pages, url: "${{ steps.d.outputs.page_url }}"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: docs}
      - id: d
        uses: actions/deploy-pages@v4
